[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "exoquery-bench"
version = "0.1.0"
description = "Evidence-first evaluation workbench for astronomy archive questions"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "astropy>=7,<9", "defusedxml>=0.7,<1", "fastapi>=0.115,<1",
  "httpx>=0.28,<1", "pydantic>=2.10,<3", "uvicorn>=0.34,<1",
]

[project.scripts]
eqb = "eqb.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "hypothesis>=6,<7", "ruff>=0.12,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/eqb"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
